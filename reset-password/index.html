<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Reset Password — Bandpath IELTS</title>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F8FB;
    --card: #FFFFFF;
    --text-primary: #16181D;
    --text-secondary: #565D6D;
    --border: #E4E7EC;
    --brand: #0B5FFF;
    --success-bg: #E7F6EC;
    --success-fg: #1E9E4B;
    --warn-bg: #FFF4E5;
    --warn-fg: #B96A00;
    --error-bg: #FDEBEC;
    --error-fg: #D3232F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .card.center { text-align: center; }
  .icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .icon-circle.success { background: var(--success-bg); color: var(--success-fg); }
  .icon-circle.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .icon-circle.error { background: var(--error-bg); color: var(--error-fg); }
  h1 {
    font-size: 20px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0;
  }
  .brand {
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-secondary);
    opacity: 0.7;
    text-align: center;
  }
  .brand strong { color: var(--brand); }
  noscript p { color: var(--error-fg); }

  form { margin-top: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input[type="password"] {
    width: 100%;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text-primary);
    outline: none;
  }
  input[type="password"]:focus { border-color: var(--brand); }
  .field-error {
    color: var(--error-fg);
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }
  .field-error.visible { display: block; }
  button[type="submit"] {
    width: 100%;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 14px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    margin-top: 4px;
  }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  .form-error {
    color: var(--error-fg);
    background: var(--error-bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .form-error.visible { display: block; }
  .loading-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-secondary);
    font-size: 14px;
  }
</style>
</head>
<body>
  <!--
    Bandpath IELTS password-recovery page.

    Hosted on GitHub Pages (this repo, "bandpath-public") — a small,
    source-free repo containing only public pages. It is set as the mobile
    app's PASSWORD_RESET_REDIRECT_URL (services/auth.ts in the main app
    repo) and must be added to Supabase's Auth -> URL Configuration ->
    Redirect URLs allowlist as its OWN, separate entry — never the same URL
    as this repo's own index.html (the signup-confirmation page).

    Why this page needs real client-side logic, unlike index.html: signup
    confirmation is already complete server-side by the time that page
    loads, so it only ever displays a message. A password reset genuinely
    isn't finished yet at that point — this page has to establish a session
    from the recovery link and call supabase.auth.updateUser({ password }).

    Why this is an IMPLICIT-flow client, not PKCE: the app's own Supabase
    client (lib/supabase.ts) uses PKCE for everything else, which would
    make resetPasswordForEmail() generate a code_verifier stored in the
    PHONE's AsyncStorage — unreachable from here, since this page runs in a
    completely different browser/JS context reached by tapping an email
    link. A PKCE code minted that way can never be exchanged here; that's
    PKCE intentionally working as designed, not a bug to route around. The
    app therefore requests the recovery email through a SEPARATE,
    implicit-flow-only Supabase client (services/auth.ts's
    supabasePasswordResetClient) specifically so Supabase issues the
    recovery link as self-contained `#access_token=...&refresh_token=...`
    URL fragment tokens instead of a `?code=` — tokens that need no
    verifier and that ANY client, on any device, can redeem directly. This
    page's own client below is configured the same way (flowType:
    'implicit', detectSessionInUrl: true) so it can actually pick those
    tokens up. This is the officially documented Supabase pattern for a
    password-recovery link completed somewhere other than where it was
    requested — see supabase-js's own resetPasswordForEmail() JSDoc
    example, which listens for the PASSWORD_RECOVERY auth event exactly as
    this page does below.

    EXPO_PUBLIC_SUPABASE_ANON_KEY below is the same public, client-safe
    anon key already shipped inside the compiled app — never the
    service_role key, a database credential, or the Brevo SMTP key. This
    page never has access to any of those and never needs them.

    Password-validation logic (minimum length, confirmation match) mirrors
    lib/passwordResetPageState.ts's validateNewPassword in the main app
    repo (Bandpath/ielts-prep) — keep both in sync if either changes. Link
    outcome state (ready/expired/invalid/error) mirrors that same file's
    determineRecoveryLinkState.
  -->
  <main class="card center" id="stateCard">
    <div class="icon-circle" id="icon"></div>
    <h1 id="heading"></h1>
    <p id="message"></p>
    <div class="loading-row" id="loadingRow" hidden>
      <span>Verifying your link…</span>
    </div>
  </main>

  <main class="card" id="formCard" hidden>
    <h1>Set a new password</h1>
    <form id="resetForm" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" />
        <div class="field-error" id="passwordError"></div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" />
        <div class="field-error" id="confirmError"></div>
      </div>
      <button type="submit" id="submitButton">Update password</button>
      <div class="form-error" id="formError"></div>
    </form>
  </main>

  <noscript>
    <main class="card center">
      <p>This page requires JavaScript. Please return to the Bandpath IELTS app and request a new password reset link.</p>
    </main>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://kudgtxdwbpfqobteyeqy.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1ZGd0eGR3YnBmcW9idGV5ZXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTQwNTYsImV4cCI6MjEwNDQ3MDA1Nn0.XpmJAgsUwnm5R-3KFHHxPMpxpwUp16QU5ga9afVantg';
      var MIN_PASSWORD_LENGTH = 8;

      var stateCard = document.getElementById('stateCard');
      var formCard = document.getElementById('formCard');
      var icon = document.getElementById('icon');
      var heading = document.getElementById('heading');
      var message = document.getElementById('message');
      var loadingRow = document.getElementById('loadingRow');

      function showState(tone, iconChar, headingText, messageText) {
        formCard.hidden = true;
        stateCard.hidden = false;
        loadingRow.hidden = true;
        icon.className = 'icon-circle ' + tone;
        icon.textContent = iconChar;
        heading.textContent = headingText;
        message.textContent = messageText;
        document.title = headingText + ' — Bandpath IELTS';
      }

      function showLoading() {
        stateCard.hidden = false;
        formCard.hidden = true;
        icon.className = 'icon-circle';
        icon.textContent = '';
        heading.textContent = 'Checking your link…';
        message.textContent = '';
        loadingRow.hidden = false;
      }

      function showForm() {
        stateCard.hidden = true;
        formCard.hidden = false;
        document.title = 'Set a new password — Bandpath IELTS';
      }

      // Mirrors lib/passwordResetPageState.ts's determineRecoveryLinkState
      // in the main app repo — see that file for the full reasoning and its
      // Jest test coverage. Supabase does not emit a distinct signal for
      // "already used" separately from "expired"/"invalid", so that case is
      // folded into the invalid state's own copy here too.
      function determineRecoveryLinkState(params) {
        if (params.error) {
          var haystack = ((params.error_code || '') + ' ' + (params.error_description || '')).toLowerCase();
          if (haystack.indexOf('expired') !== -1) {
            return {
              status: 'expired',
              icon: '⏱',
              tone: 'warn',
              heading: 'This link has expired',
              message: 'Password reset links expire after a while for your security. Please return to the Bandpath IELTS app and request a new one from "Forgot password?".',
            };
          }
          return {
            status: 'invalid',
            icon: '⚠',
            tone: 'warn',
            heading: 'This link is invalid or has already been used',
            message: 'Please return to the Bandpath IELTS app and request a new password reset link from "Forgot password?".',
          };
        }
        if (params.hasRecoveryTokens) {
          return { status: 'ready', icon: '', tone: '', heading: 'Set a new password', message: '' };
        }
        return {
          status: 'error',
          icon: '!',
          tone: 'error',
          heading: 'We couldn’t verify this link',
          message: 'Something unexpected happened loading this page. Please return to the Bandpath IELTS app and request a new password reset link, or try again in a few minutes.',
        };
      }

      // Mirrors lib/passwordResetPageState.ts's validateNewPassword.
      function validateNewPassword(password, confirmPassword) {
        if (password.length < MIN_PASSWORD_LENGTH) {
          return { ok: false, error: 'too_short', message: 'Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.' };
        }
        if (password !== confirmPassword) {
          return { ok: false, error: 'mismatch', message: 'Passwords do not match.' };
        }
        return { ok: true };
      }

      // Supabase's recovery redirect carries error params (?error=...&
      // error_code=...&error_description=...) or success tokens
      // (#access_token=...&refresh_token=...&type=recovery) — merge both
      // query and hash the same way supabase-js's own parseParametersFromURL
      // does (hash first, then query overrides) so this reads identically
      // regardless of which one Supabase used for a given response.
      function parseUrlParams() {
        var result = {};
        var hash = window.location.hash;
        if (hash && hash[0] === '#') {
          try {
            new URLSearchParams(hash.substring(1)).forEach(function (value, key) {
              result[key] = value;
            });
          } catch (e) {
            // hash wasn't a query string — ignore.
          }
        }
        new URLSearchParams(window.location.search).forEach(function (value, key) {
          result[key] = value;
        });
        return result;
      }

      try {
        var rawParams = parseUrlParams();
        var linkState = determineRecoveryLinkState({
          error: rawParams.error || null,
          error_code: rawParams.error_code || null,
          error_description: rawParams.error_description || null,
          hasRecoveryTokens: Boolean(rawParams.access_token),
        });

        if (linkState.status !== 'ready') {
          showState(linkState.tone, linkState.icon, linkState.heading, linkState.message);
          return;
        }

        showLoading();

        // Implicit-flow client (see the header comment above for exactly
        // why) — detectSessionInUrl parses the #access_token=... fragment
        // automatically and establishes a session from it.
        var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
        });

        var settled = false;
        function onSessionReady() {
          if (settled) return;
          settled = true;
          showForm();
        }
        function onSessionFailed() {
          if (settled) return;
          settled = true;
          showState(
            'error',
            '!',
            'We couldn’t verify this link',
            'Something unexpected happened loading this page. Please return to the Bandpath IELTS app and request a new password reset link, or try again in a few minutes.'
          );
        }

        // This is the officially documented pattern (see supabase-js's own
        // resetPasswordForEmail() example): PASSWORD_RECOVERY fires once the
        // SDK has parsed the URL's tokens into a real session.
        client.auth.onAuthStateChange(function (event, session) {
          if (event === 'PASSWORD_RECOVERY' && session) onSessionReady();
        });
        // Belt-and-suspenders: getSession() awaits the same URL-detection
        // work internally, so this resolves to the same session even if the
        // PASSWORD_RECOVERY event were ever missed by the listener above.
        client.auth
          .getSession()
          .then(function (result) {
            if (result && result.data && result.data.session) onSessionReady();
            else onSessionFailed();
          })
          .catch(onSessionFailed);
        // A genuinely hung network call must not leave the page stuck on
        // "Checking your link…" forever.
        setTimeout(onSessionFailed, 8000);

        var form = document.getElementById('resetForm');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirmPassword');
        var passwordError = document.getElementById('passwordError');
        var confirmError = document.getElementById('confirmError');
        var formError = document.getElementById('formError');
        var submitButton = document.getElementById('submitButton');

        function clearErrors() {
          passwordError.className = 'field-error';
          confirmError.className = 'field-error';
          formError.className = 'form-error';
          passwordError.textContent = '';
          confirmError.textContent = '';
          formError.textContent = '';
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          clearErrors();

          var validation = validateNewPassword(passwordInput.value, confirmInput.value);
          if (!validation.ok) {
            var target = validation.error === 'too_short' ? passwordError : confirmError;
            target.textContent = validation.message;
            target.className = 'field-error visible';
            return;
          }

          submitButton.disabled = true;
          submitButton.textContent = 'Updating…';

          client.auth
            .updateUser({ password: passwordInput.value })
            .then(function (result) {
              if (result.error) {
                formError.textContent = result.error.message || 'Could not update your password. Please try again.';
                formError.className = 'form-error visible';
                submitButton.disabled = false;
                submitButton.textContent = 'Update password';
                return;
              }
              showState(
                'success',
                '✓',
                'Password updated successfully',
                'Please return to the Bandpath IELTS app and sign in with your new password.'
              );
            })
            .catch(function (err) {
              formError.textContent = (err && err.message) || 'Network error — please check your connection and try again.';
              formError.className = 'form-error visible';
              submitButton.disabled = false;
              submitButton.textContent = 'Update password';
            });
        });
      } catch (e) {
        // Whatever went wrong, this must never leave the page blank.
        showState(
          'error',
          '!',
          'We couldn’t verify this link',
          'Something unexpected happened loading this page. Please return to the Bandpath IELTS app and request a new password reset link, or try again in a few minutes.'
        );
      }
    })();
  </script>

  <div class="brand">Bandpath <strong>IELTS</strong></div>
</body>
</html>
